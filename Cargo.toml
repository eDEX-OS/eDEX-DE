[workspace]
members = [
    "edex-de",
    "edex-greeter",
    "platform",
    "renderer",
    "ui",
    "terminal",
    "launcher",
    "settings",
    "sysmon",
    "notifications",
    "hypr",
    "ipc",
    "system",
]
resolver = "2"

[workspace.package]
version = "3.3.0"
edition = "2021"
authors = ["eDEX-OS"]
license = "GPL-3.0"
repository = "https://github.com/eDEX-OS/eDEX-DE"

[workspace.dependencies]
# Wayland client stack
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-cursor = "0.31"
raw-window-handle = "0.6"
xkbcommon = { version = "0.9", features = ["wayland"] }

# GPU / text
wgpu = { version = "29.0.3", default-features = false, features = ["vulkan", "gles", "wgsl"] }
glyphon = "0.11.0"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Terminal
alacritty_terminal = "0.26"
unicode-width = "0.2"

# System
sysinfo = "0.39"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-io = "2"
futures-util = "0.3"
rustix = { version = "1", features = ["process", "fs", "pipe"] }
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
notify = "8"
roxmltree = "0.21"
libc = "0.2"

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fuzzy-matcher = "0.3"
xdg = "2"
insta = "1"
tempfile = "3"
