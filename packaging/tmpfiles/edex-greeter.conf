# Cache directory for the greeter's last-user state (owned by the greetd user).
d /var/cache/edex-greeter 0750 greeter greeter -
# Each user's eDEX theme name, written by eDEX-DE and read by the greeter (sticky: users can
# only replace their own file; the greeter also checks ownership).
d /var/lib/edex-greeter 0755 root root -
d /var/lib/edex-greeter/themes 1777 root root -
