# greetd configuration for the eDEX greeter. Install as /etc/greetd/config.toml
# (eDEX-OS ships it as a drop-in via edex-os-greetd-config).
[terminal]
vt = 1

[default_session]
# cage runs the greeter as a kiosk compositor (with a text-login fallback if it cannot start).
command = "edex-greeter-session"
user = "greeter"
